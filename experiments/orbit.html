<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>軌道実験 — Creative Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#090d1b;color:#edf0ff;font:15px system-ui,sans-serif}main{max-width:980px;margin:auto;padding:20px}h1{font-size:1.6rem}p,small{color:#b4bdd5}canvas{width:100%;height:min(64vh,540px);min-height:350px;display:block;border:1px solid #36405b;border-radius:12px;background:#090d1b}section{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:15px 0}button{background:#273557;border:1px solid #58688e;color:#fff;border-radius:8px;padding:9px 12px}input{accent-color:#aab3ff}output{font-variant-numeric:tabular-nums}strong{color:#f4d2a1}</style></head><body><main><small>CREATIVE LAB · PROTOTYPE · NOT RELEASED</small><h1>軌道実験 — 横向きの速さで運命は変わる？</h1><p>青い惑星の周囲を粒子が飛びます。赤は落下、緑は周回候補、黄は脱出候補。これは物理法則を単純化した比較実験です。</p><canvas id="c"></canvas><section><label>初速度（円軌道を1.00とする） <input id="speed" type="range" min="0" max="180" value="100" step="5"> <output id="speedValue">1.00</output>倍</label><button id="launch">同じ位置から発射</button><button id="compare">3つの速度を比較</button><button id="clear">クリア</button><button id="pause">一時停止</button></section><p id="status">初期条件を選んで発射してください。</p><small>設計上の仮定：中心天体は固定、粒子同士の衝突なし、空気抵抗なし、重力は距離の2乗に反比例。惑星表面に接触すると落下として停止。端は壁ではなく、十分離れた粒子を追跡終了とします。数値積分による近似です。</small></main><script>(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let w=0,h=0,objects=[],paused=false,last=0;const R=24,GM=19000;function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=Math.round(w*d);c.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0)}function add(factor,color){const radius=Math.min(w*.25,h*.36,145),v=Math.sqrt(GM/radius)*factor;objects.push({x:radius,y:0,vx:0,vy:-v,color,state:'flight',trace:[],factor});status()}function status(){$('status').textContent=objects.map(o=>o.factor.toFixed(2)+'倍: '+(o.state==='impact'?'惑星に衝突':o.state==='escaped'?'観測範囲外':o.state==='flight'?'飛行中':'停止')).join(' ／ ')||'初期条件を選んで発射してください。'}$('speed').oninput=()=>{$('speedValue').textContent=(+$('speed').value/100).toFixed(2)};$('launch').onclick=()=>{objects=[];add(+$('speed').value/100,'#7ad9c2')};$('compare').onclick=()=>{objects=[];add(.6,'#ff9b89');add(1,'#7ad9c2');add(1.55,'#ffda88')};$('clear').onclick=()=>{objects=[];status()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'再開':'一時停止'};function accel(x,y){const r=Math.max(R,Math.hypot(x,y)),a=-GM/(r*r*r);return [x*a,y*a]}function tick(dt){for(const o of objects){if(o.state!=='flight')continue;const n=Math.max(1,Math.ceil(dt/0.16)),hstep=dt/n;for(let i=0;i<n;i++){const a=accel(o.x,o.y);o.vx+=a[0]*hstep*.5;o.vy+=a[1]*hstep*.5;o.x+=o.vx*hstep;o.y+=o.vy*hstep;const b=accel(o.x,o.y);o.vx+=b[0]*hstep*.5;o.vy+=b[1]*hstep*.5;if(Math.hypot(o.x,o.y)<=R){o.state='impact';break}if(Math.hypot(o.x,o.y)>Math.max(w,h)*2){o.state='escaped';break}}if(o.trace.length>1500)o.trace.shift();o.trace.push([o.x,o.y])}}function draw(t){requestAnimationFrame(draw);let dt=Math.min((t-last)/1000||0,.04);last=t;if(!paused){tick(dt*38)}ctx.clearRect(0,0,w,h);const cx=w/2,cy=h/2;ctx.save();ctx.translate(cx,cy);ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fillStyle='#4778ba';ctx.fill();ctx.strokeStyle='#9cc7ff';ctx.stroke();for(const o of objects){ctx.beginPath();o.trace.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=o.color;ctx.globalAlpha=.7;ctx.stroke();ctx.globalAlpha=1;if(o.state!=='escaped'){ctx.beginPath();ctx.arc(o.x,o.y,4,0,Math.PI*2);ctx.fillStyle=o.color;ctx.fill()}}ctx.restore();if(Math.floor(t/700)!==Math.floor((t-16)/700))status()}window.addEventListener('resize',resize);resize();requestAnimationFrame(draw)})();</script></body></html>
