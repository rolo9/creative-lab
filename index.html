<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>余白の宇宙 v0.3</title><style>*{box-sizing:border-box}body{margin:0;background:#090d1b;color:#e9ebfc;font:14px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px}h1{font-weight:500}p{color:#aeb6d1}canvas{display:block;width:100%;height:min(62vh,600px);min-height:350px;background:#090d1b;border:1px solid #36405b;border-radius:14px;touch-action:none}section{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:15px 0}button{background:#1c2643;border:1px solid #53618c;border-radius:9px;padding:10px;color:#fff;font:inherit}button.selected{background:#505aa1}input{accent-color:#a5afff}small{color:#aeb6d1}</style><main><small>CO-CREATION / EXPERIMENT 01</small><h1>余白の宇宙 <small>v0.3</small></h1><p>触れることはできる。支配することはできない。場は最大3つ。タップで選択し、強さを個別に調整。ドラッグで移動。</p><canvas id="world"></canvas><section><button id="attract" class="selected">引力 ＋</button><button id="repel">反発 −</button><button id="erase">消去 ×</button><label>粒子の自由度 <input id="freedom" type="range" min="0" max="100" value="56"></label><label>選択中の場の強さ <input id="strength" type="range" min="0" max="100" value="35" disabled><output id="powerValue">—</output></label><button id="pause">一時停止</button><button id="clear">場を消す</button><button id="restart">新しい宇宙</button></section><p id="status">粒子 180 · 場 0/3 · 場をタップして選択</p><small>紫の輪＝引力 ／ 珊瑚色の輪＝反発。画面端では粒子が反射します。</small></main><script>(()=>{'use strict';const c=document.getElementById('world'),ctx=c.getContext('2d');const $=x=>document.getElementById(x);let w,h,particles=[],fields=[],selected=-1,mode='attract',drag=-1,paused=false,last=0,step=0;const rand=(a,b)=>a+Math.random()*(b-a);function status(){const f=fields[selected];$('status').textContent='粒子 '+particles.length+' · 場 '+fields.length+'/3'+(f?' · 選択中：'+(selected+1)+'番 '+(f.type==='attract'?'引力':'反発'):' · 場をタップして選択');$('strength').disabled=!f;$('strength').value=f?Math.round(f.power*100):35;$('powerValue').textContent=f?Math.round(f.power*100)+'%':'—'}function reset(){particles=Array.from({length:180},()=>({x:rand(0,w),y:rand(0,h),vx:rand(-.7,.7),vy:rand(-.7,.7),phase:rand(0,6.28),hue:rand(190,295)}));fields=[];selected=-1;ctx.fillStyle='#090d1b';ctx.fillRect(0,0,w,h);status()}function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=Math.round(w*d);c.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);if(!particles.length)reset()}function point(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function pick(p){return fields.findIndex(f=>Math.hypot(f.x-p.x,f.y-p.y)<27)}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);const p=point(e),i=pick(p);if(mode==='erase'){if(i>=0){fields.splice(i,1);selected=-1}status();return}if(i>=0){drag=i;selected=i}else if(fields.length<3){fields.push({...p,type:mode,power:.35});drag=fields.length-1;selected=drag}else{selected=-1}status()});c.addEventListener('pointermove',e=>{if(drag>=0){Object.assign(fields[drag],point(e))}});c.addEventListener('pointerup',()=>drag=-1);c.addEventListener('pointercancel',()=>drag=-1);['attract','repel','erase'].forEach(id=>$(id).onclick=()=>{mode=id;['attract','repel','erase'].forEach(x=>$(x).classList.toggle('selected',x===id))});$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'再開':'一時停止'};$('strength').oninput=()=>{if(fields[selected]){fields[selected].power=+$('strength').value/100;status()}};$('clear').onclick=()=>{fields=[];selected=-1;status()};$('restart').onclick=reset;function draw(t){requestAnimationFrame(draw);const dt=Math.min((t-last)/16.67||1,2);last=t;if(paused)return;step+=dt;ctx.fillStyle='rgba(9,13,27,.105)';ctx.fillRect(0,0,w,h);const freedom=+$('freedom').value/100;for(const f of fields){ctx.beginPath();ctx.arc(f.x,f.y,25+Math.sin(step*.045)*3,0,Math.PI*2);ctx.strokeStyle=f.type==='attract'?'#9790ff':'#ff8f79';ctx.lineWidth=fields.indexOf(f)===selected?3:1;ctx.stroke();ctx.lineWidth=1;ctx.beginPath();ctx.arc(f.x,f.y,4,0,Math.PI*2);ctx.fillStyle=ctx.strokeStyle;ctx.fill()}for(const p of particles){let ax=0,ay=0;for(const f of fields){const dx=f.x-p.x,dy=f.y-p.y,d=Math.hypot(dx,dy)+.0001,inf=1/(1+(d/125)**2),rad=(f.type==='attract'?1:-1)*f.power*.085*inf*Math.tanh((d-34)/48);ax+=dx/d*rad;ay+=dy/d*rad;if(f.type==='attract'){const swirl=.032*f.power*inf;ax-=dy/d*swirl;ay+=dx/d*swirl}}const noise=(.006+freedom*.038)*dt;p.vx+=(ax+Math.cos(p.phase+step*.012)*noise)*dt;p.vy+=(ay+Math.sin(p.phase*1.17+step*.01)*noise)*dt;const damp=Math.max(.88,1-(.009+(.6-freedom)*.005)*dt);p.vx*=damp;p.vy*=damp;const v=Math.hypot(p.vx,p.vy);if(v>2.4){p.vx*=2.4/v;p.vy*=2.4/v}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<3){p.x=3;p.vx=Math.abs(p.vx)*.8}if(p.x>w-3){p.x=w-3;p.vx=-Math.abs(p.vx)*.8}if(p.y<3){p.y=3;p.vy=Math.abs(p.vy)*.8}if(p.y>h-3){p.y=h-3;p.vy=-Math.abs(p.vy)*.8}ctx.beginPath();ctx.arc(p.x,p.y,1.05,0,Math.PI*2);ctx.fillStyle='hsla('+p.hue+',95%,78%,.8)';ctx.fill()}}window.addEventListener('resize',resize);resize();requestAnimationFrame(draw)})();</script></html>
